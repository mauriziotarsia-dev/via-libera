<style>
:root{
  color-scheme: light;
  --page:#E6E8EB; --ink:#14171B; --ink-2:#5A616B; --surface:#FFFFFF; --line:#CBD0D7;
  --tray:#16181B; --tray-lip:#343840; --floor:#202328; --stud:#2B2F36; --stud-hi:#3E434D; --dash:#9299A3;
  --focus:#0A66FF;
  --font:"Overpass","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0F1114; --ink:#EDEFF2; --ink-2:#9AA1AB; --surface:#1B1E23; --line:#2F343C;
    --tray:#050607; --tray-lip:#3D424C; --floor:#191C20; --stud:#252930; --stud-hi:#373C46; --dash:#7F8690;
    --focus:#6AA5FF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0F1114; --ink:#EDEFF2; --ink-2:#9AA1AB; --surface:#1B1E23; --line:#2F343C;
  --tray:#050607; --tray-lip:#3D424C; --floor:#191C20; --stud:#252930; --stud-hi:#373C46; --dash:#7F8690;
  --focus:#6AA5FF;
}

/* the three looks: piece colours, board materials, colour of the round controls */
[data-skin="cars"]{ --c-r:#E8452E; --c-y:#F3B61F; --c-b:#2D5BDA; --c-g:#27AE86; --c-h:#A30F2D; --mark:#F3B61F; --sign:#1557C0 }
[data-skin="medieval"]{
  --c-r:#C9402E; --c-y:#E2AA2C; --c-b:#3F63BD; --c-g:#3F9460; --c-h:#9E1030; --mark:#F2C24B; --sign:#7A4A21;
  --tray:#5C5244; --tray-lip:#3E372D; --merlon:#9C8F79; --floor:#4E453A; --slab-a:#8C7F6A; --slab-b:#978A73; --slab-c:#817560; --slab-hi:#B3A68E;
}
[data-skin="harbor"]{
  --c-r:#E6503A; --c-y:#F5C02C; --c-b:#4B7BEA; --c-g:#35B98D; --c-h:#A30F2D; --mark:#FFD34D; --sign:#0E6E83;
  --tray:#6E4D2F; --tray-lip:#47301B; --plank:#7D5936; --floor:#12506A; --wave:#5FB3CC; --cellmark:#1A6180;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--page); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35;
  overflow-x:hidden; -webkit-text-size-adjust:100%; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
input{-webkit-user-select:text; user-select:text; font-family:inherit; color:inherit}
button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,.veh:focus-visible,input:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
[hidden]{display:none !important}

.app{
  max-width:540px; min-height:100vh; min-height:100dvh; margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px;
  overflow-x:hidden; overflow-x:clip; /* the freed piece drives off the board: never let it widen the page */
}

/* top bar */
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.pill{
  justify-self:start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 15px 0 12px;
  border-radius:20px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:.9375rem;
}
.pill svg,.iconbtn svg{width:20px; height:20px}
.where{display:flex; align-items:center; gap:10px}
.badge{
  min-width:40px; height:40px; padding:2px 6px 0; border-radius:20px; display:grid; place-items:center;
  background:var(--tier); color:var(--tier-ink); font-weight:900; font-size:1.0625rem; font-variant-numeric:tabular-nums;
}
.wtxt{display:flex; flex-direction:column; line-height:1.15}
.wtxt strong{font-weight:800; font-size:1rem}
.wtxt span{color:var(--ink-2); font-size:.8125rem}
.iconbtn{
  justify-self:end; width:40px; height:40px; padding:0; border-radius:50%; border:1.5px solid var(--line);
  background:var(--surface); display:grid; place-items:center; flex:none;
}

/* counters */
.stats{display:flex; justify-content:center; gap:22px; margin:2px 0 0; color:var(--ink-2); font-size:.9375rem}
.stats b{color:var(--ink); font-weight:800; font-variant-numeric:tabular-nums; margin-left:3px}

/* board */
.stage{
  --frame:clamp(10px,3.4vw,16px);
  --grid:max(168px, min(calc(100vw - 50px - 2 * var(--frame)), 468px, calc(100vh - 300px)));
  --grid:max(168px, min(calc(100vw - 50px - 2 * var(--frame)), 468px, calc(100dvh - 300px)));
  display:flex; justify-content:center; padding:2px 0;
}
.tray{
  position:relative; padding:var(--frame); background:var(--tray); border-radius:calc(var(--frame) * 1.9);
  box-shadow:inset 0 0 0 1.5px var(--tray-lip), 0 14px 26px -16px rgba(0,0,0,.6);
}
.grid{
  --cell:calc(var(--grid) / 6);
  position:relative; width:var(--grid); height:var(--grid); background:var(--floor); border-radius:7px; touch-action:none;
}
.floor{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:inherit}
.stud{fill:var(--stud)}
.stud-hi{fill:none; stroke:var(--stud-hi); stroke-width:2.5; stroke-linecap:round}
.dash{fill:var(--dash); opacity:.8}
.exit{
  position:absolute; left:calc(100% - 1px); top:calc(var(--cell) * 2); width:calc(var(--frame) + 12px); height:var(--cell);
  background:var(--floor); border-radius:0 9px 9px 0; display:grid; place-items:center; color:var(--mark);
  box-shadow:0 -1.5px 0 var(--tray-lip), 0 1.5px 0 var(--tray-lip), 1.5px 0 0 var(--tray-lip);
}
.exit svg{width:74%; height:auto; display:block}
.exit.flash svg{animation:flash .5s ease-in-out 2}
@keyframes flash{50%{opacity:.25}}

/* medieval: crenellated stone wall, two gate towers */
[data-skin="medieval"] .tray{border-radius:calc(var(--frame) * .9)}
[data-skin="medieval"] .tray::before{
  content:""; position:absolute; inset:2.5px; border-radius:calc(var(--frame) * .7); pointer-events:none;
  border:calc(var(--frame) * .5) dashed var(--merlon); opacity:.9;
}
[data-skin="medieval"] .grid{border-radius:3px}
[data-skin="medieval"] .exit{border-radius:0}
[data-skin="medieval"] .exit::before,[data-skin="medieval"] .exit::after{
  content:""; position:absolute; right:-3px; width:calc(var(--frame) * 1.25); height:calc(var(--frame) * 1.25); border-radius:50%;
  background:var(--merlon); box-shadow:inset 0 0 0 3px var(--tray-lip), 0 2px 0 rgba(0,0,0,.35);
}
[data-skin="medieval"] .exit::before{top:calc(var(--frame) * -.95)}
[data-skin="medieval"] .exit::after{bottom:calc(var(--frame) * -.95)}
/* harbour: plank quay, two channel buoys */
[data-skin="harbor"] .tray{background:repeating-linear-gradient(90deg, var(--plank) 0 13px, var(--tray) 13px 15px)}
[data-skin="harbor"] .exit::before,[data-skin="harbor"] .exit::after{
  content:""; position:absolute; right:3px; width:11px; height:11px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 2px 3px rgba(0,0,0,.4);
}
[data-skin="harbor"] .exit::before{top:-5px; background:#E6503A}
[data-skin="harbor"] .exit::after{bottom:-5px; background:#35B98D}

.veh,.ghost{
  position:absolute; left:0; top:0;
  width:calc(var(--cell) * var(--w)); height:calc(var(--cell) * var(--h));
  transform:translate3d(calc(var(--cell) * var(--x)), calc(var(--cell) * var(--y)), 0);
}
.veh{
  z-index:2; cursor:grab; touch-action:none; border-radius:calc(var(--cell) * .26);
  transition:transform .16s cubic-bezier(.2,.9,.25,1);
}
.veh svg{width:100%; height:100%; display:block; overflow:visible; pointer-events:none; transition:transform .12s ease-out}
.veh.dragging{transition:none; cursor:grabbing; z-index:5}
.veh.dragging svg{transform:scale(1.035)}
.veh.leaving{transition:transform .6s cubic-bezier(.55,0,.85,.5), opacity .18s linear .42s; opacity:0; z-index:6}
.veh.enter svg{animation:drop .34s cubic-bezier(.2,.9,.25,1) both; animation-delay:calc(var(--i) * 24ms)}
@keyframes drop{from{opacity:0; transform:scale(.8)}}
.veh.hint{z-index:3}
.veh.hint svg{animation:pulse .95s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07); filter:brightness(1.18)}}
.veh.nope.h svg{animation:nopeX .26s ease-in-out}
.veh.nope.v svg{animation:nopeY .26s ease-in-out}
@keyframes nopeX{25%{transform:translateX(-3.5%)}75%{transform:translateX(3.5%)}}
@keyframes nopeY{25%{transform:translateY(-3.5%)}75%{transform:translateY(3.5%)}}
.ghost{z-index:4; pointer-events:none}
.ghost::after{
  content:""; position:absolute; inset:calc(var(--cell) * .09); border-radius:calc(var(--cell) * .22);
  border:2.5px dashed rgba(255,255,255,.92); background:rgba(255,255,255,.1);
}

/* message line */
.status{margin:0; min-height:2.7em; display:grid; place-items:center; text-align:center; color:var(--ink-2); font-size:.9375rem; padding:0 8px; text-wrap:balance}

/* controls, shaped like round signs */
.controls{display:flex; justify-content:center; gap:clamp(16px,8vw,40px); margin-top:auto; padding-bottom:2px}
.sign{display:flex; flex-direction:column; align-items:center; gap:7px; min-width:76px; padding:2px; border:0; background:none; font-weight:600; font-size:.8125rem}
.disc{
  width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--sign); color:#fff;
  box-shadow:inset 0 0 0 2.5px var(--sign), inset 0 0 0 4.5px #fff; transition:transform .1s ease-out;
}
.disc svg{width:27px; height:27px}
.sign:active .disc{transform:scale(.93)}
.sign:disabled{opacity:.38; cursor:default}
.sign:disabled .disc{transform:none}

/* result sheet */
.result{
  position:fixed; z-index:20; left:0; right:0; bottom:0; max-width:540px; margin:0 auto; background:var(--surface);
  border-radius:24px 24px 0 0; padding:22px 20px max(20px,env(safe-area-inset-bottom)); text-align:center;
  box-shadow:0 -16px 44px -18px rgba(0,0,0,.5), 0 0 0 1.5px var(--line);
  transform:translateY(105%); transition:transform .34s cubic-bezier(.2,.9,.25,1);
}
.result.show{transform:none}
.result h2{margin:0; font-weight:900; font-size:1.875rem; letter-spacing:-.01em; line-height:1.1}
.result .perfect{display:inline-flex; align-items:center; gap:6px; margin:10px 0 0; padding:5px 12px 3px 9px; border-radius:16px; background:#F3B61F; color:#2A1E00; font-weight:800; font-size:.875rem}
.result .perfect svg{width:16px; height:16px; margin-top:-3px}
.result p{margin:10px auto 0; max-width:34ch; color:var(--ink-2); text-wrap:balance}
.actions{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; height:50px; padding:2px 14px 0; border-radius:25px; border:1.5px solid var(--line); background:transparent; font-weight:800; font-size:1rem}
.btn.primary{flex:1.6; background:var(--ink); border-color:var(--ink); color:var(--page)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}

/* full-height sheets: levels and menu */
dialog{color:var(--ink); font-family:var(--font)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{
  width:100%; max-width:540px; height:100%; max-height:100vh; max-height:100dvh; margin:0 auto; padding:0; border:0;
  background:var(--page); overflow:hidden;
}
.sheet[open]{display:flex; flex-direction:column}
.sheet-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding:max(14px,env(safe-area-inset-top)) 14px 12px 16px; border-bottom:1.5px solid var(--line);
}
.sheet-head h2{margin:0; font-weight:900; font-size:1.5rem; letter-spacing:-.01em; line-height:1.15}
.sheet-head p{margin:3px 0 0; color:var(--ink-2); font-size:.875rem}
.sheet-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:6px 14px max(24px,env(safe-area-inset-bottom))}
.tier h3{display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px; font-weight:800; font-size:1.0625rem}
.tier h3 i{width:12px; height:12px; border-radius:50%; background:var(--tier); align-self:center; margin-top:-3px}
.tier h3 small{font-weight:400; font-size:.8125rem; color:var(--ink-2)}
.tier h3 em{margin-left:auto; font-style:normal; font-weight:600; font-size:.8125rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.cells{display:grid; grid-template-columns:repeat(8,1fr); gap:7px}
.lv{
  position:relative; aspect-ratio:1; padding:2px 0 0; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
  font-weight:800; font-size:.875rem; font-variant-numeric:tabular-nums; display:grid; place-items:center;
}
.lv.done{background:var(--tier); border-color:var(--tier); color:var(--tier-ink)}
.lv.perfect::after{
  content:"★"; position:absolute; top:-5px; right:-4px; width:16px; height:16px; border-radius:50%; display:grid; place-items:center;
  background:var(--page); color:var(--ink); font-size:10px; line-height:1;
}
.lv.current{box-shadow:0 0 0 2px var(--page), 0 0 0 4.5px var(--ink)}

/* menu */
.blk{margin:0 2px; padding:18px 0 20px; border-bottom:1.5px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk h3{margin:0 0 12px; font-weight:800; font-size:1.0625rem}
.blk h4{margin:18px 0 8px; font-weight:600; font-size:.875rem; color:var(--ink-2)}
.blk p,.blk li{color:var(--ink-2); font-size:.9375rem; max-width:60ch}
.blk p{margin:10px 0 0}
.blk ul{margin:0; padding-left:1.1em}
.blk li{margin:4px 0}
.save{
  display:flex; align-items:center; gap:10px; padding:11px 10px 10px 14px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); margin:0 0 8px;
}
.save.current{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.save .who{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2}
.save .who strong{font-weight:800; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.save .who span{color:var(--ink-2); font-size:.8125rem; margin-top:2px}
.chip{height:36px; padding:2px 14px 0; border-radius:18px; border:1.5px solid var(--line); background:transparent; font-weight:600; font-size:.875rem; flex:none}
.chip.solid{background:var(--ink); border-color:var(--ink); color:var(--page)}
.chip.icon{width:36px; padding:0; display:grid; place-items:center}
.chip.icon svg{width:18px; height:18px}
.row2{display:flex; gap:10px; margin-top:12px}
.row2 .btn{height:46px; font-size:.9375rem}
.skins{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.skin{display:flex; flex-direction:column; gap:7px; align-items:stretch; padding:7px 7px 8px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; font-size:.875rem; text-align:center}
.skin[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.skin .pv{display:block; border-radius:10px; background:var(--floor); padding:6px 5px; overflow:hidden}
.skin .pv svg{display:block; width:100%; height:auto; overflow:visible}
.switchrow{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:0; border:0; background:none; font-weight:800; font-size:1.0625rem; text-align:left}
.switch{position:relative; width:52px; height:32px; border-radius:16px; background:var(--line); transition:background .15s; flex:none}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .15s}
[aria-checked="true"] .switch{background:var(--sign)}
[aria-checked="true"] .switch::after{transform:translateX(20px)}

/* small dialogs */
.confirm{width:min(360px, calc(100vw - 32px)); border:0; border-radius:20px; padding:20px; background:var(--surface)}
.confirm h2{margin:0; font-weight:900; font-size:1.25rem; line-height:1.2}
.confirm p{margin:8px 0 0; color:var(--ink-2); font-size:.9375rem}
.confirm .actions{margin-top:18px}
.confirm .btn{height:46px; font-size:.9375rem}
.confirm .btn.primary{flex:1.3}
.field{display:block; margin:14px 0 0}
.field > span{display:block; font-weight:600; font-size:.875rem; color:var(--ink-2); margin:0 0 6px}
.field input{width:100%; height:48px; padding:2px 14px 0; border-radius:14px; border:1.5px solid var(--line); background:var(--page); font-size:1.0625rem; font-weight:600}
.field .err{display:block; min-height:1.3em; margin:5px 2px 0; color:#C2321F; font-size:.8125rem; font-weight:600}
.stepper{display:flex; gap:8px; align-items:center}
.stepper input{flex:1; text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper button{width:48px; height:48px; border-radius:14px; border:1.5px solid var(--line); background:transparent; font-size:1.375rem; font-weight:600; line-height:1; flex:none}
.tierpick{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
.tierpick button{height:32px; padding:2px 11px 0; border-radius:16px; border:0; background:var(--tier); color:var(--tier-ink); font-weight:800; font-size:.8125rem}

@media (min-width:560px){ .cells{gap:9px} .lv{font-size:1rem} }
@media (prefers-reduced-motion: reduce){
  .veh,.veh svg,.result,.disc,.switch,.switch::after{transition-duration:.01s !important}
  .veh.enter svg,.veh.hint svg,.veh.nope svg,.exit.flash svg{animation:none !important}
  .veh.leaving{transition:opacity .25s linear !important}
}
</style>
</head>

<script id="logic">
/* Pure game logic: level parsing and shortest-path solver (no DOM). */
(function (root) {
  'use strict';
  // "grid:colors:min" — grid is 36 chars (row-major), 'o' empty, 'A' the car to free, 'B'.. other vehicles.
  function parseLevel(str) {
    var parts = str.split(':'), g = parts[0], colors = parts[1] || '', cellsOf = {}, i;
    for (i = 0; i < 36; i++) { var ch = g.charAt(i); if (ch !== 'o') (cellsOf[ch] = cellsOf[ch] || []).push(i); }
    var vehicles = Object.keys(cellsOf).sort().map(function (ch, k) {
      var cells = cellsOf[ch], horiz = cells[1] - cells[0] === 1, r = Math.floor(cells[0] / 6), c = cells[0] % 6, line = horiz ? r : c;
      return { hero: ch === 'A', horiz: horiz, len: cells.length, line: line, pos: horiz ? c : r, color: ch === 'A' ? 'h' : (colors.charAt(k - 1) || 'b'), face: line % 2 === 0 ? 1 : -1 };
    });
    return { vehicles: vehicles, min: parseInt(parts[2], 10) || 0 };
  }
  function cellOf(v, q) { return v.horiz ? v.line * 6 + q : q * 6 + v.line; }
  // Free range [min, max] for vehicle i given every vehicle position.
  function range(vs, pos, i) {
    var occ = new Uint8Array(36), j, t, v = vs[i];
    for (j = 0; j < vs.length; j++) if (j !== i) for (t = 0; t < vs[j].len; t++) occ[cellOf(vs[j], pos[j] + t)] = 1;
    var lo = pos[i], hi = pos[i];
    while (lo > 0 && !occ[cellOf(v, lo - 1)]) lo--;
    while (hi + v.len < 6 && !occ[cellOf(v, hi + v.len)]) hi++;
    return [lo, hi];
  }
  // Breadth-first search; one move = one vehicle sliding any distance. Returns [{i, to}, ...] or null.
  function solve(vs, start, limit) {
    var n = vs.length, pow = [], m = 1, i;
    for (i = 0; i < n; i++) { pow.push(m); m *= 5; }
    var enc = 0; for (i = 0; i < n; i++) enc += start[i] * pow[i];
    var seen = new Map(), keys = [enc], parent = [-1], mvI = [-1], mvTo = [-1], p = new Array(n), occ = new Uint8Array(36);
    seen.set(enc, 0); limit = limit || 600000;
    for (var h = 0; h < keys.length; h++) {
      var k = keys[h], t, q;
      for (i = 0; i < n; i++) { p[i] = k % 5; k = (k - p[i]) / 5; }
      if (p[0] === 4) { var out = []; for (var s = h; parent[s] >= 0; s = parent[s]) out.push({ i: mvI[s], to: mvTo[s] }); return out.reverse(); }
      occ.fill(0);
      for (i = 0; i < n; i++) for (t = 0; t < vs[i].len; t++) occ[cellOf(vs[i], p[i] + t)] = 1;
      for (i = 0; i < n; i++) {
        var v = vs[i], base = keys[h] - p[i] * pow[i], nk;
        for (q = p[i] - 1; q >= 0 && !occ[cellOf(v, q)]; q--) { nk = base + q * pow[i]; if (!seen.has(nk)) { seen.set(nk, 1); keys.push(nk); parent.push(h); mvI.push(i); mvTo.push(q); } }
        for (q = p[i] + 1; q + v.len - 1 < 6 && !occ[cellOf(v, q + v.len - 1)]; q++) { nk = base + q * pow[i]; if (!seen.has(nk)) { seen.set(nk, 1); keys.push(nk); parent.push(h); mvI.push(i); mvTo.push(q); } }
      }
      if (keys.length > limit) return null;
    }
    return null;
  }
  root.VL = { parseLevel: parseLevel, range: range, solve: solve, cellOf: cellOf };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  // Consecutive slides of the same piece count as one move, like lifting a finger mid-way.

  function clearHint() { ghost.hidden = true; vehicles.forEach(function (v) { if (v.el) v.el.classList.remove('hint'); }); }

    var v = vehicles[sol[0].i], to = sol[0].to, n = Math.abs(to - v.pos), dir = v.horiz ? (to > v.pos ? 'a destra' : 'a sinistra') : (to > v.pos ? 'in basso' : 'in alto');

  function win() {

    if (!prev || moves < prev) s.best[level + 1] = moves;
    s.board = null; s.level = Math.min(RAW.length - 1, level + 1); commitSave(true);

    var perfect = moves <= minMoves, text;

    else if (!prev || moves < prev) text = 'Risolto in ' + moves + ' mosse' + (prev ? ', nuovo record' : '') + '. Il minimo è ' + minMoves + '.';
    else text = 'Risolto in ' + moves + ' mosse. Il tuo record è ' + prev + ', il minimo è ' + minMoves + '.';

  }
  function showResult() { result.hidden = false; void result.offsetWidth; result.classList.add('show'); controls.style.visibility = 'hidden'; if (byKeyboard) { try { $('btnNextLevel').focus({ preventScroll: true }); } catch (e) {} } }
  function hideResult() { result.classList.remove('show'); result.hidden = true; controls.style.visibility = ''; }
  // Show the active saved game: its look, its level, the board as it was left.
  function applyActive(message) { notice = message; paintBoard(); loadLevel(S().level, true); }

  /* =====================================================================
     Level sheet
     ===================================================================== */
  function buildSheet() {

      html += '</div></section>';

    $('sheetBody').innerHTML = html;
    $('sheetBody').addEventListener('click', function (e) {

  }

      b.classList.toggle('done', !!mine); b.classList.toggle('perfect', !!mine && mine <= min); b.classList.toggle('current', i === level);
      if (mine) { counts[Math.floor(i / PER_TIER)]++; label += mine <= min ? ', risolto con il minimo di mosse' : ', risolto in ' + mine + ' mosse'; if (mine <= min) perfect++; }
      b.setAttribute('aria-label', label); if (i === level) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-count]'), function (el) { var ti = +el.getAttribute('data-count'); el.textContent = counts[ti] + ' su ' + Math.min(PER_TIER, RAW.length - ti * PER_TIER); });

    $('sheetSummary').textContent = n === 0 ? 'Scegli da quale livello partire: sono tutti aperti.' : n + ' di ' + RAW.length + ' risolti, ' + perfect + ' con il minimo di mosse.';

    h += '<section class="blk"><h3>Come si gioca</h3><ul><li>Il pezzo cremisi (l\'auto a strisce, la carrozza reale o il motoscafo, secondo lo stile) deve uscire dal varco a destra.</li><li>Ogni pezzo si muove solo avanti e indietro, lungo la propria corsia.</li><li>Ogni spostamento conta una mossa, di quante caselle vuoi.</li></ul></section>';

  }
  function refreshOpenPanels() { if (menu.open) renderMenu(); if (sheet.open) refreshSheet(); if (statusDefault && !won) setStatus(''); updateStats(); }
  function openMenu() {

  $('tierPick').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-start]') : null; if (b) $('startInput').value = b.getAttribute('data-start'); });
  $('btnConfirmNo').addEventListener('click', function () { closeDlg(confirmDlg); });

  /* ---------- wiring ---------- */
